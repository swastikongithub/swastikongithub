name: profile-maintenance

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-profile-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh timestamp
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          Path("assets/last-updated.txt").write_text(datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/last-updated.txt
          git diff --cached --quiet || git commit -m "chore: refresh profile"
          git push
